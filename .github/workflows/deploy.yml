name: Deploy & Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Pre-Deployment Verification
  verify:
    name: Verify Release Quality & Version Alignment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Hard-Gate: Version Consistency Verification
        run: |
          echo "Verifying Git tag ${{ github.ref_name }} against plugin files..."
          php bin/check-version-consistency.php --tag=${{ github.ref_name }}

      - name: Hard-Gate: Static Codebase & Syntax Validation
        run: python3 tests/validate_codebase.py

      - name: Hard-Gate: Run Automated Security Test Suite
        run: php tests/test-suite.php

  # 2. Package & Publish Dual Distribution
  release:
    name: Package & Publish Dual Distribution
    needs: [ verify ]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: wp-cli

      - name: Compile Translation Template (POT)
        run: |
          php bin/make-pot.php

      - name: Extract Clean Version String
        id: get_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Target version: ${VERSION}"

      - name: Extract Changelog from readme.txt
        id: extract_changelog
        run: |
          php -r '
            $readme = file_get_contents("readme.txt");
            $version = preg_quote("${{ steps.get_version.outputs.version }}", "/");
            $changelog = "";
            if (preg_match("/=\s*{$version}\s*=\s*\n(.*?)(?=\n=\s*[0-9]|\n==|$)/s", $readme, $m)) {
              $changelog = trim($m[1]);
            } elseif (preg_match("/== Changelog ==(.*?)(?:==|$)/s", $readme, $m)) {
              $changelog = trim($m[1]);
            }
            file_put_contents("/tmp/release_notes.txt", $changelog);
          '

      # Build Dual Distribution Targets (WP.org Guideline 8 Compliance)
      - name: Build Dual Release Packages
        run: |
          chmod +x bin/build-release.sh
          ./bin/build-release.sh "${{ steps.get_version.outputs.version }}"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Site Checkup Pro v${{ steps.get_version.outputs.version }}"
          body_path: /tmp/release_notes.txt
          files: |
            site-checkup-pro.zip
            site-checkup-pro-selfhosted.zip
            site-checkup-pro-wporg.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. WordPress.org SVN Deploy (WP.org Guidelines 8, 14 & 15 Compliance)
      # - Guideline 8: Deploys the stripped WP.org target (zero self-hosted update checkers).
      # - Guideline 14: Triggered strictly on git tags (v*), never on routine main commits or readme tweaks.
      # - Guideline 15: 10up action commits atomically to both /tags/{version}/ and /trunk/ in one operation,
      #   guaranteeing trunk/readme.txt reflects the current version simultaneously.
      - name: Deploy to WordPress.org SVN Repository (Stripped Guideline 8 Build)
        if: env.SVN_PASSWORD != ''
        uses: 10up/action-wordpress-plugin-deploy-svn@v2.2.2
        with:
          generate_zip: false
          assets_dir: 'media'
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: site-checkup-pro
          BUILD_DIR: 'build/wporg/site-checkup-pro'
